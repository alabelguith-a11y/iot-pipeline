# Full architecture (dev profile): Simulator -> MQTT -> Bridge -> Kafka -> Consumer -> PostgreSQL -> ETL
# Quick start: cp .env.example .env && docker compose up -d --build
x-app: &app
  build: .
  restart: unless-stopped
  environment: &env
    PROFILE: dev
    TRANSPORT: mqtt            # set to zmq to swap the transport (needs the two ZMQ_* lines below)
    ZMQ_BIND: tcp://0.0.0.0:5556       # bridge binds here ...
    ZMQ_ENDPOINT: tcp://bridge:5556    # ... simulator connects here
    QUEUE: kafka
    MQTT_HOST: mosquitto
    KAFKA_BOOTSTRAP: kafka:9092
    DB_URL: postgresql://${POSTGRES_USER:-iot}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-iot}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-iot}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iot}"]
      interval: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: ["./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]

  kafka:
    image: apache/kafka:3.8.0       # KRaft mode, no ZooKeeper
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  bridge:
    <<: *app
    command: python -m iotpipe.bridge
    depends_on: [mosquitto, kafka]

  consumer:
    <<: *app
    command: python -m iotpipe.consumer
    depends_on:
      kafka: {condition: service_started}
      postgres: {condition: service_healthy}

  simulator:
    <<: *app
    command: python -m iotpipe.simulator --devices 4 --per-device 120 --rate 20 --loop
    depends_on: [bridge]

  etl:
    <<: *app
    command: python -m iotpipe.etl.runner --every 60
    depends_on:
      postgres: {condition: service_healthy}
      consumer: {condition: service_started}

  metabase:                         # optional BI (free Looker Studio alternative): docker compose --profile viz up
    image: metabase/metabase:latest
    profiles: [viz]
    ports: ["3000:3000"]
    depends_on: [postgres]

volumes:
  pgdata:
