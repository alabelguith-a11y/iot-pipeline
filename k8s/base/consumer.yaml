apiVersion: apps/v1
kind: Deployment
metadata: {name: consumer, namespace: iot, labels: {app: consumer}}
spec:
  replicas: 1
  selector: {matchLabels: {app: consumer}}
  template:
    metadata: {labels: {app: consumer}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: consumer
          image: iot-pipeline:local
          imagePullPolicy: IfNotPresent
          command: [python, -m, iotpipe.consumer]
          envFrom:
            - configMapRef: {name: iot-config}
            - secretRef: {name: iot-db}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
