apiVersion: batch/v1
kind: CronJob
metadata: {name: etl, namespace: iot}
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 10001}
          containers:
            - name: etl
              image: iot-pipeline:local
              imagePullPolicy: IfNotPresent
              command: [python, -m, iotpipe.etl.runner]   # exits 1 when an assertion fails -> Job fails -> alertable
              envFrom:
                - configMapRef: {name: iot-config}
                - secretRef: {name: iot-db}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 250m, memory: 192Mi}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
