# NOT applied by kustomize. Create the real one with:
#   kubectl -n iot create secret generic iot-db --from-literal=DB_URL='postgresql://iot:<password>@postgres:5432/iot'
apiVersion: v1
kind: Secret
metadata: {name: iot-db, namespace: iot}
stringData:
  DB_URL: postgresql://iot:change-me@postgres:5432/iot
